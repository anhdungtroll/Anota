<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#e9eefc">
<meta name="application-name" content="Anota">
<meta name="apple-mobile-web-app-title" content="Anota">
<meta name="mobile-web-app-capable" content="yes">
<title>Anota</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<link rel="modulepreload" href="app.js">
<link rel="modulepreload" href="db.js">
</head>
<body class="at-home">
<div id="wrap">
<div id="main">

<nav id="tabs" class="tabs" aria-label="Open notes"></nav>

<!-- ============ HOME / LIBRARY ============ -->
<section id="library" class="screen">
  <header class="lib-head">
    <div class="brand"><img src="icons/icon-192.png" alt="" class="logo"><h1>Anota</h1></div>
    <label class="search"><span id="searchIcon"></span><input id="search" type="search" placeholder="Search notes" autocomplete="off"></label>
    <button id="btnSettings" class="ib" aria-label="Gestures and pen settings"></button>
  </header>
  <div class="filters" id="filters"></div>
  <nav class="crumbs" id="crumbs" hidden aria-label="Folder path"></nav>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    <div class="empty-art" id="emptyArt"></div>
    <h2 id="emptyTitle">Nothing here yet</h2>
    <p>Start a notebook, open a whiteboard, import a PDF to mark up, or make a folder.</p>
  </div>
  <div class="fab-wrap">
    <div id="fabmenu" class="fabmenu" hidden></div>
    <button id="fab" class="fab" aria-label="Create new"></button>
  </div>
</section>

<!-- ============ EDITOR ============ -->
<section id="editor" class="screen" hidden>
  <header class="topbar">
    <button id="btnBack" class="ib" aria-label="Home"></button>
    <button id="docTitle" class="title" aria-label="Rename"></button>
    <button id="btnUndo" class="ib" aria-label="Undo"></button>
    <button id="btnRedo" class="ib" aria-label="Redo"></button>
    <button id="btnPages" class="ib" aria-label="Pages"></button>
    <button id="btnMore" class="ib" aria-label="More"></button>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <button id="pageInd" class="pageind" hidden></button>
    <div id="zoomInd" class="zoomind"></div>
    <div id="flash" class="flash"></div>
    <div id="selbar" class="selbar" hidden></div>
    <canvas id="minimap" class="minimap" width="300" height="200" hidden></canvas>
  </div>

  <nav class="dock" id="dock"></nav>
  <div id="pop" class="pop" hidden></div>
  <div id="menu" class="menu" hidden></div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-head"><h3>Pages</h3><span class="grow"></span><button id="sheetBm" class="btn small ghost" aria-label="Show bookmarked pages only">★ Bookmarks</button><button id="sheetAdd" class="btn small"></button><button id="sheetClose" class="ib"></button></div>
      <div id="sheetGrid" class="sheet-grid"></div>
    </div>
  </div>
  <button id="focusExit" class="focus-exit" aria-label="Leave focus mode"></button>
</section>

<div id="toast" class="toast" hidden></div>
</div><!-- /main -->
</div><!-- /wrap -->
<dialog id="dlg"></dialog>
<input type="file" id="file" accept="application/pdf,.pdf,.doc,.docx,.rtf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
<input type="file" id="imgfile" accept="image/*" hidden>
<input type="file" id="camfile" accept="image/*" capture="environment" hidden>

<script type="module" src="app.js"></script>
</body>
</html>
